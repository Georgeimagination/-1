<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>AWS_Trainium2_one_chip_产品详解-架构</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#687984"/></marker></defs><rect width="1200" height="820" fill="white"/><text x="32" y="38" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" fill="#26333D" text-anchor="start">AWS Trainium2</text><text x="32" y="67" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#5C6770" text-anchor="start">计算与存储访问示意；连线只示意主要路径，不推定物理裸片 / 封装拆分</text><rect x="205" y="108" width="760" height="585" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="221" y="135" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">单颗芯片逻辑：8 × NeuronCore-v3</text><rect x="230" y="156" width="480" height="410" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="246" y="183" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">展开其中一个 NeuronCore（其余同类核省略）</text><rect x="253" y="208" width="205" height="90" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="355.5" y="247.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Tensor Engine</text><text x="355.5" y="271.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">矩阵 / 卷积</text><rect x="478" y="208" width="205" height="90" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="580.5" y="247.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Vector + Scalar</text><text x="580.5" y="271.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">向量 / 逐元素</text><rect x="253" y="345" width="205" height="105" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="355.5" y="379.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">SBUF</text><text x="355.5" y="403.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">28 MiB / core</text><text x="355.5" y="427.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">软件管理工作存储</text><rect x="478" y="345" width="205" height="105" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="580.5" y="379.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">PSUM</text><text x="580.5" y="403.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">2 MiB / core</text><text x="580.5" y="427.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">矩阵结果 / 累加</text><path d="M355,298 L355,345" stroke="#687984" stroke-width="2" fill="none" marker-start="url(#arrow)"/><path d="M440,298 L465,325 L581,325 L581,345" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="253" y="480" width="430" height="57" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="468.0" y="514.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">GPSIMD：可编程算子路径</text><rect x="740" y="215" width="195" height="115" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="837.5" y="266.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">数据搬运 / DMA</text><text x="837.5" y="290.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">显式移动数据</text><rect x="740" y="375" width="195" height="115" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="837.5" y="414.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">通信辅助</text><text x="837.5" y="438.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">CC-Core</text><text x="837.5" y="462.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">细节见正文</text><path d="M710,270 L740,270" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M710,425 L740,425" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="300" y="605" width="330" height="55" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="465.0" y="638.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Host 接口（规格见正文）</text><rect x="740" y="587" width="195" height="77" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="837.5" y="619.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" fill="#26333D" text-anchor="middle">NeuronLink</text><text x="837.5" y="643.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="400" fill="#26333D" text-anchor="middle">4 × v3 interfaces</text><path d="M837,490 L837,587" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="108" y="182" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">本地 HBM</text><rect x="38" y="212" width="140" height="61" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="108.0" y="248.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">HBM stack 1</text><rect x="38" y="290" width="140" height="61" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="108.0" y="326.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">HBM stack 2</text><rect x="38" y="368" width="140" height="61" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="108.0" y="404.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">HBM stack 3</text><rect x="38" y="446" width="140" height="61" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="108.0" y="482.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">HBM stack 4</text><text x="108" y="550" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">96 GiB</text><path d="M190,359 L205,359" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="995" y="568" width="175" height="112" rx="9" fill="#F5F6F7" stroke="#73808A" stroke-width="2"/><text x="1082.5" y="618.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">外部设备</text><text x="1082.5" y="642.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">其他加速器 / 系统</text><path d="M935,625 L995,625" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="775" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">粉色是软件管理的 SRAM 或本地 DRAM；SBUF / PSUM 不是透明 L2 cache。</text><text x="32" y="798" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">HBM stack 数量已公开时逐个画出；排列仅供阅读，不表示物理封装位置。</text><path d="M190,242 L190,476" stroke="#687984" stroke-width="2" fill="none"/><path d="M178,242 L190,242" stroke="#687984" stroke-width="2" fill="none"/><path d="M178,320 L190,320" stroke="#687984" stroke-width="2" fill="none"/><path d="M178,398 L190,398" stroke="#687984" stroke-width="2" fill="none"/><path d="M178,476 L190,476" stroke="#687984" stroke-width="2" fill="none"/></svg>