<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title>Google_Cloud_TPU_v5e_one_chip_产品详解-架构</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#687984"/></marker></defs><rect width="1200" height="740" fill="white"/><text x="32" y="38" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" fill="#26333D" text-anchor="start">Google Cloud TPU v5e</text><text x="32" y="67" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#5C6770" text-anchor="start">功能与存储层级示意；连线表示访问关系，不表示物理布局或所有数据的必经路径</text><rect x="35" y="100" width="920" height="550" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="51" y="127" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">单颗芯片及其本地存储</text><rect x="205" y="153" width="545" height="390" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="221" y="180" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">计算逻辑（内部物理拆分仅在正文有证据时说明）</text><rect x="235" y="200" width="485" height="115" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="477.5" y="251.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">1 × TensorCore</text><text x="477.5" y="275.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">4 × 128×128 MXU + vector + scalar</text><rect x="235" y="355" width="270" height="130" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="370.0" y="414.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">VMEM</text><text x="370.0" y="438.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">128 MiB / TensorCore</text><rect x="530" y="355" width="190" height="130" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="625.0" y="414.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">SMEM</text><text x="625.0" y="438.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">1 MiB / TensorCore</text><path d="M365,315 L365,355" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M620,315 L620,355" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="58" y="235" width="125" height="190" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="120.5" y="312.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">HBM2E</text><text x="120.5" y="336.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">16 GB / GiB</text><text x="120.5" y="360.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">单位差异见正文</text><text x="120.5" y="384.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">stack 数未公开</text><path d="M183,325 L205,325" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="775" y="230" width="150" height="190" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="850.0" y="307.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">芯片间接口</text><text x="850.0" y="331.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">4 × ICI ports</text><text x="850.0" y="355.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">400 GB/s 双向聚合</text><path d="M750,325 L775,325" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="340" y="575" width="290" height="50" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="485.0" y="606.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">主机接口（规格见正文）</text><path d="M480,543 L480,575" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="990" y="240" width="175" height="165" rx="9" fill="#F5F6F7" stroke="#73808A" stroke-width="2"/><text x="1077.5" y="304.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">外部系统</text><text x="1077.5" y="328.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">其他加速器</text><text x="1077.5" y="352.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">CPU / 网络</text><path d="M925,325 L990,325" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="718" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">蓝：计算与专用单元　粉：存储　绿：接口。图示来源与未披露部分见正文图注。</text></svg>