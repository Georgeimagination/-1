<text x="55" y="791" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#26333D">Total cores / matrix shape / frequency / peak throughput / cache geometry / die count / process / package / power</text>
<text x="55" y="817" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#26333D">MLU-Link endpoints and bandwidth; external-memory type, capacity and stack count</text>
<text x="35" y="862" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5C6770">Arrows denote software copy / operand paths. Source mapping and limits are stated in the article figure caption.</text>
