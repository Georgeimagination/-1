<text x="35" y="70" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5C6770">Compiler capacities and source-code paths from reviewed sources; no physical floorplan is implied.</text>
