<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>Groq_GroqChip_Processor_第一代-架构</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#687984"/></marker></defs><rect width="1200" height="850" fill="white"/><text x="32" y="38" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" fill="#26333D" text-anchor="start">GroqChip Processor | First generation</text><text x="32" y="67" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#5C6770" text-anchor="start">Functionally sliced dataflow; logical connections, not physical floorplan</text><rect x="50" y="100" width="1100" height="605" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="66" y="127" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">Single ASIC die | 14nm</text><rect x="85" y="155" width="240" height="150" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="205.0" y="200.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">MEM SRAM</text><text x="205.0" y="224.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">44 west + 44 east slices</text><text x="205.0" y="248.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">220MiB ≈ 230MB</text><text x="205.0" y="272.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Compiler-managed</text><rect x="375" y="155" width="270" height="150" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="510.0" y="212.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">MXM matrix compute</text><text x="510.0" y="236.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">4 independent planes</text><text x="510.0" y="260.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">320 × 320 each</text><rect x="695" y="155" width="185" height="150" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="787.5" y="224.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">VXM</text><text x="787.5" y="248.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">5,120 vector ALUs</text><rect x="930" y="155" width="185" height="150" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="1022.5" y="224.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">SXM</text><text x="1022.5" y="248.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Data rearrangement</text><rect x="85" y="355" width="1030" height="62" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="600.0" y="392.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">Stream registers | East / west data movement</text><path d="M205,305 L205,355" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M510,305 L510,355" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M787,305 L787,355" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1022,305 L1022,355" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="85" y="465" width="490" height="70" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="330.0" y="494.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">ICU | 144 instruction queues</text><text x="330.0" y="518.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">Compiler schedules operations and transfers</text><rect x="625" y="465" width="490" height="70" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="870.0" y="494.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">On-chip ECC protection</text><text x="870.0" y="518.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">SRAM + stream datapath</text><rect x="150" y="620" width="380" height="60" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="340.0" y="656.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">PCIe Gen4 ×16 controller</text><rect x="670" y="620" width="380" height="60" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="860.0" y="656.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">16 RealScale C2C interfaces</text><path d="M340,680 L340,735" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M860,680 L860,735" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="818" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">External DRAM is not listed in cited first-generation sources. MEM is compiler-managed SRAM.</text><rect x="150" y="735" width="380" height="45" rx="9" fill="#F4F6F7" stroke="#73808A" stroke-width="2"/><text x="340" y="764" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">Host</text><rect x="670" y="735" width="380" height="45" rx="9" fill="#F4F6F7" stroke="#73808A" stroke-width="2"/><text x="860" y="764" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">Other Groq chips</text></svg>