text x="740.0" y="624.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">External LPDDR4</text><text x="740.0" y="648.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Capacity not specified</text><rect x="895" y="590" width="230" height="80" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="1010.0" y="624.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">External LPDDR4</text><text x="1010.0" y="648.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Capacity not specified</text><path d="M740,500 L740,590" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1010,500 L1010,590" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="718" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">Functional schematic, not floorplan. Cache and explicitly managed buffers are distinct.</text></svg>