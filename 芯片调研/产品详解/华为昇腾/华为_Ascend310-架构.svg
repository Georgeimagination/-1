<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title>华为_Ascend310-架构</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#687984"/></marker></defs><rect width="1200" height="740" fill="white"/><text x="32" y="38" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" fill="#26333D" text-anchor="start">Huawei Ascend 310</text><text x="32" y="67" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#5C6770" text-anchor="start">SoC-level organization; external DRAM configuration is board-dependent</text><rect x="40" y="105" width="1120" height="445" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="56" y="132" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">Ascend 310 SoC | 12nm</text><rect x="70" y="160" width="300" height="115" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="220.0" y="199.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">2 × Da Vinci AI Core</text><text x="220.0" y="223.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Cube / Vector / Scalar / MTE</text><text x="220.0" y="247.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Local buffers: sizes not fixed here</text><rect x="400" y="160" width="300" height="115" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="550.0" y="199.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">CPU + control</text><text x="550.0" y="223.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">8 × Cortex-A55 + DSU</text><text x="550.0" y="247.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">A55 scheduler / low-power M3</text><rect x="730" y="160" width="395" height="115" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="927.5" y="199.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">Media + peripherals</text><text x="927.5" y="223.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Video / JPEG / PNG</text><text x="927.5" y="247.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">PCIe 3.0 / 1GbE / USB 3.0</text><rect x="70" y="315" width="1055" height="50" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="597.5" y="346.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">512-bit CHIE interconnect</text><path d="M220,275 L220,315" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M550,275 L550,315" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M930,275 L930,315" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="70" y="410" width="240" height="90" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="190.0" y="449.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">On-chip buffer</text><text x="190.0" y="473.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" 