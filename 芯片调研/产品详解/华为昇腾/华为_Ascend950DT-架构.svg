rrow)"/><path d="M1065,550 L1065,777 L975,777" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="828" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">A DRAM module is not a single DRAM die. Total capacities are not assigned evenly to individual AI Die.</text></svg>