<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img"><title>NVIDIA_H100_PCIe_80GB-架构</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#687984"/></marker></defs><rect width="1200" height="790" fill="white"/><text x="32" y="38" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" fill="#26333D" text-anchor="start">NVIDIA H100 PCIe 80GB</text><text x="32" y="67" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#5C6770" text-anchor="start">Compute, on-chip storage and device memory · functional hierarchy</text><rect x="25" y="100" width="930" height="580" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="41" y="127" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">PCIe accelerator card</text><rect x="48" y="145" width="885" height="420" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="64" y="172" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">GPU package · 1 GPU die + 5 HBM stacks</text><rect x="305" y="190" width="367" height="325" rx="12" fill="white" stroke="#377991" stroke-width="2"/><text x="321" y="217" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#377991" text-anchor="start">GH100 / Hopper</text><rect x="325" y="245" width="327" height="78" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="488.5" y="278.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">SM groups</text><text x="488.5" y="302.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">114 SM · 456 Tensor Cores</text><rect x="325" y="340" width="327" height="62" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="488.5" y="365.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">Local storage</text><text x="488.5" y="389.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">256 KB L1 / shared per SM</text><rect x="325" y="425" width="327" height="62" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="488.5" y="462.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">50 MB L2 cache</text><path d="M489,324 L489,338" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M489,402 L489,423" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="76" y="215" width="170" height="63" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="161.0" y="252.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">HBM2e stack 1</text><rect x="76" y="325" width="170" height="63" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="161.0" y="362.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">HBM2e stack 2</text><rect x="76" y="435" width="170" height="63" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="161.0" y="472.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">HBM2e stack 3</text><rect x="725" y="270" width="170" height="63" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="810.0" y="307.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">HBM2e stack 4</text><rect x="725" y="410" width="170" height="63" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="810.0" y="447.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">HBM2e stack 5</text><path d="M246,247 L278,247 L278,455 L305,455" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M246,357 L278,357" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M246,467 L278,467" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M672,455 L698,455 L698,302 L725,302" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M698,442 L725,442" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="75" y="541" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="start">80 GB HBM2e total · 2,000 GB/s · HBM controller paths simplified</text><rect x="65" y="600" width="375" height="50" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="252.5" y="631.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">PCIe Gen5 x16</text><rect x="472" y="600" width="445" height="50" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="694.5" y="631.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">NVLink bridge · 600 GB/s bidir.</text><rect x="987" y="450" width="185" height="70" rx="9" fill="#F5F6F7" stroke="#73808A" stroke-width="2"/><text x="1079.5" y="479.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Host system</text><text x="1079.5" y="503.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">PCIe endpoint</text><path d="M440,625 L455,625 L455,580 L972,580 L972,485 L984,485" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="987" y="590" width="185" height="70" rx="9" fill="#F5F6F7" stroke="#73808A" stroke-width="2"/><text x="1079.5" y="619.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Other GPUs</text><text x="1079.5" y="643.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">External topology</text><path d="M919,625 L984,625" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="722" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">Blue: compute   Pink: storage   Green: I/O   ·   bidir. = sum of both directions</text><text x="32" y="745" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">Connections show access relationships, not compulsory data paths; layout is not a physical floorplan.</text><text x="32" y="768" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">Enabled resources are shown where verified. See figure caption for source locations and unresolved fields.</text></svg>