<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img"><title>NVIDIA_A100_SXM4_80GB-架构</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#687984"/></marker></defs><rect width="1200" height="790" fill="white"/><text x="32" y="38" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" fill="#26333D" text-anchor="start">NVIDIA A100 SXM4 80GB</text><text x="32" y="67" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#5C6770" text-anchor="start">Compute, on-chip storage and device memory · functional hierarchy</text><rect x="25" y="100" width="930" height="580" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="41" y="127" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">SXM module</text><rect x="48" y="145" width="885" height="420" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="64" y="172" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">GPU package · GPU die and HBM</text><rect x="75" y="190" width="558" height="333" rx="12" fill="white" stroke="#377991" stroke-width="2"/><text x="91" y="217" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#377991" text-anchor="start">GA100 / Ampere GPU die</text><rect x="98" y="247" width="513" height="76" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="354.5" y="279.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">SM groups</text><text x="354.5" y="303.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="middle">108 SM · 432 Tensor Cores</text><rect x="98" y="341" width="513" height="68" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="354.5" y="369.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">Local storage</text><text x="354.5" y="393.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">192 KB L1 / shared memory per SM</text><rect x="98" y="440" width="513" height="60" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="354.5" y="476.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">40 MB L2 cache</text><path d="M353,324 L353,339" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M353,410 L353,437" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="711" y="265" width="195" height="160" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="808.5" y="315.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">80 GB HBM2e</text><text x="808.5" y="339.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">2,039 GB/s</text><text x="808.5" y="363.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Device count</text><text x="808.5" y="387.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">not resolved</text><path d="M634,471 L672,471 L672,345 L708,345" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="75" y="548" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="start">HBM stack count is not inferred from capacity or interface width.</text><rect x="65" y="600" width="375" height="50" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="252.5" y="631.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">PCIe Gen4 x16</text><rect x="472" y="600" width="445" height="50" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="694.5" y="631.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">NVLink 3 · 600 GB/s bidir.</text><rect x="987" y="450" width="185" height="70" rx="9" fill="#F5F6F7" stroke="#73808A" stroke-width="2"/><text x="1079.5" y="479.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Host system</text><text x="1079.5" y="503.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">PCIe endpoint</text><path d="M440,625 L455,625 L455,580 L972,580 L972,485 L984,485" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="987" y="590" width="185" height="70" rx="9" fill="#F5F6F7" stroke="#73808A" stroke-width="2"/><text x="1079.5" y="619.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Other GPUs</text><text x="1079.5" y="643.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">External topology</text><path d="M919,625 L984,625" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="722" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">Blue: compute   Pink: storage   Green: I/O   ·   bidir. = sum of both directions</text><text x="32" y="745" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">Connections show access relationships, not compulsory data paths; layout is not a physical floorplan.</text><text x="32" y="768" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">Unresolved values refer to the cited sources. See figure caption for source locations.</text></svg>