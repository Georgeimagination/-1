ans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">not fixed here</text><path d="M695,484 L718,484 L718,338 L735,338" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="80" y="190" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="start">Enabled SM count not resolved</text><rect x="65" y="600" width="375" height="50" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="252.5" y="631.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">PCIe Gen6 x16</text><rect x="472" y="600" width="445" height="50" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="694.5" y="631.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">NVLink 5 · 1.8 TB/s bidir.</text><rect x="987" y="450" width="185" height="70" rx="9" fill="#F5F6F7" stroke="#73808A" stroke-width="2"/><text x="1079.5" y="479.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Host system</text><text x="1079.5" y="503.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">PCIe endpoint</text><path d="M440,625 L455,625 L455,580 L972,580 L972,485 L984,485" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="987" y="590" width="185" height="70" rx="9" fill="#F5F6F7" stroke="#73808A" stroke-width="2"/><text x="1079.5" y="619.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Other GPUs</text><text x="1079.5" y="643.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#263