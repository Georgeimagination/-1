ns-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">功能分组与访问关系示意，不是物理 floorplan；来源：CDNA 4 白皮书 Figures 1,2,5 / pp.9-13。</text><path d="M30,610 L15,610 L15,758 L80,758" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1170,610 L1185,610 L1185,758 L1115,758" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/></svg>