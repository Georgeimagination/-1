<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img"><title>MI455X-架构</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#687984"/></marker></defs><rect width="1200" height="920" fill="white"/><text x="32" y="38" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" fill="#26333D" text-anchor="start">AMD Instinct MI455X | CDNA 5</text><text x="32" y="67" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#5C6770" text-anchor="start">8 compute dies + 2 fabric/cache dies + 2 I/O dies + 12 HBM4 stacks</text><rect x="30" y="95" width="1140" height="575" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="46" y="122" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">单 GPU 封装 · 3D hybrid bonding + CoWoS-L</text><rect x="60" y="146" width="745" height="215" rx="12" fill="white" stroke="#377991" stroke-width="2"/><text x="76" y="173" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#377991" text-anchor="start">8 × XCD · TSMC N2</text><rect x="78" y="193" width="163" height="60" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="159.5" y="217.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 0</text><text x="159.5" y="241.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active WGP</text><rect x="258" y="193" width="163" height="60" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="339.5" y="217.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 1</text><text x="339.5" y="241.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active WGP</text><rect x="438" y="193" width="163" height="60" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="519.5" y="217.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 2</text><text x="519.5" y="241.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active WGP</text><rect x="618" y="193" width="163" height="60" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="699.5" y="217.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 3</text><text x="699.5" y="241.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active WGP</text><rect x="78" y="270" width="163" height="60" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="159.5" y="294.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 4</text><text x="159.5" y="318.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active WGP</text><rect x="258" y="270" width="163" height="60" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="339.5" y="294.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 5</text><text x="339.5" y="318.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active WGP</text><rect x="438" y="270" width="163" height="60" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="519.5" y="294.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 6</text><text x="519.5" y="318.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active WGP</text><rect x="618" y="270" width="163" height="60" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="699.5" y="294.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 7</text><text x="699.5" y="318.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active WGP</text><rect x="835" y="151" width="300" height="205" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="985.0" y="211.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">每个 WGP</text><text x="985.0" y="235.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">Wave32 · Matrix / SIMD</text><text x="985.0" y="259.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">320KB LDS + 64KB vector cache</text><text x="985.0" y="283.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">16KB constant / 64KB instruction</text><text x="985.0" y="307.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">TDM 异步 tensor 数据搬运</text><rect x="60" y="405" width="745" height="97" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="432.5" y="435.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">2 × FCD · TSMC N3P</text><text x="432.5" y="459.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="middle">global L2：192MB · 全 GPU 合计 54TB/s</text><text x="432.5" y="483.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="middle">Infinity Fabric / HBM4 接口</text><rect x="835" y="405" width="300" height="97" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="985.0" y="435.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">12 × HBM4 stacks</text><text x="985.0" y="459.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="middle">合计 432GB · 23.3TB/s</text><text x="985.0" y="483.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="middle">2,048-bit / stack</text><path d="M420,361 L420,405" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M805,453 L835,453" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="60" y="542" width="1075" height="77" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="597.5" y="574.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">2 × IOD · CPU / scale-up / scale-out 接口</text><text x="597.5" y="598.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">与 XCD / FCD 通过 Infinity Fabric 连接；IOD 工艺节点未单独确认</text><path d="M420,502 L420,542" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="50" y="735" width="320" height="95" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="210.0" y="764.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">主机 CPU</text><text x="210.0" y="788.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Infinity Fabric</text><text x="210.0" y="812.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">256GB/s 双向合计</text><rect x="415" y="735" width="350" height="95" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="590.0" y="764.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">Helios 内的其他 GPU</text><text x="590.0" y="788.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">36 × UALoE links</text><text x="590.0" y="812.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">3.6TB/s 双向合计</text><rect x="810" y="735" width="340" height="95" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="980.0" y="764.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">外部 scale-out NIC</text><text x="980.0" y="788.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">UALink 或 PCIe 6</text><text x="980.0" y="812.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">最高 600GB/s 双向合计</text><path d="M210,670 L210,735" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M590,670 L590,735" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M980,670 L980,735" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="875" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">功能与访问关系示意，不是物理 floorplan；HBM、L2 与外部通信带宽分别属于不同路径。</text><text x="32" y="898" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">来源：CDNA 5 白皮书 Figure 3 / pp.9-10,13-15；AMD CDNA 页面 I/O Die / Fabric and Cache Die。</text></svg>