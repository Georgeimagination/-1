<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>MI350P-架构</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#687984"/></marker></defs><rect width="1200" height="850" fill="white"/><text x="32" y="38" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" fill="#26333D" text-anchor="start">AMD Instinct MI350P | CDNA 4</text><text x="32" y="67" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#5C6770" text-anchor="start">A PCIe card with 4 compute dies, 1 I/O die and 144GB HBM3E</text><rect x="30" y="95" width="1140" height="615" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="46" y="122" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">MI350P PCIe 插卡 · 全高全长 / 双槽 · 被动散热</text><rect x="60" y="145" width="1080" height="520" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="76" y="172" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">GPU 封装：4 XCD + 1 IOD；所查资料未给 HBM stack 数量</text><rect x="90" y="195" width="720" height="205" rx="12" fill="white" stroke="#377991" stroke-width="2"/><text x="106" y="222" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#377991" text-anchor="start">4 × XCD 计算裸片</text><rect x="110" y="239" width="325" height="57" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="272.5" y="261.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 0</text><text x="272.5" y="285.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active CU + 4MB L2</text><rect x="455" y="239" width="325" height="57" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="617.5" y="261.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 1</text><text x="617.5" y="285.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active CU + 4MB L2</text><rect x="110" y="309" width="325" height="57" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="272.5" y="331.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 2</text><text x="272.5" y="355.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active CU + 4MB L2</text><rect x="455" y="309" width="325" height="57" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="617.5" y="331.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">XCD 3</text><text x="617.5" y="355.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#26333D" text-anchor="middle">32 active CU + 4MB L2</text><rect x="845" y="211" width="265" height="168" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="977.5" y="265.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">每个 CU</text><text x="977.5" y="289.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">4 Matrix Core</text><text x="977.5" y="313.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">32KB L1 cache</text><text x="977.5" y="337.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">160KB LDS · 软件管理</text><rect x="90" y="452" width="720" height="108" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="450.0" y="488.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">1 × IOD</text><text x="450.0" y="512.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="middle">128MB Infinity Cache（4 个 XCD 共享）</text><text x="450.0" y="536.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="middle">内存 / 通信功能 · 不套用双 IOD OAM 配置</text><path d="M440,400 L440,452" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="845" y="452" width="265" height="108" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="977.5" y="488.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">HBM3E</text><text x="977.5" y="512.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">144GB · 4TB/s</text><text x="977.5" y="536.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">所查资料未给 stack 数量</text><path d="M810,506 L845,506" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="100" y="605" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="start">共 128 CU / 512 Matrix Core；工艺表列 3nm / 6nm，未逐裸片映射。</text><text x="100" y="636" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="start">所查资料未给 Infinity Fabric 封装内细节及卡间直连；不绘制推测的 scale-up 链路。</text><rect x="390" y="742" width="420" height="60" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="600.0" y="766.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="700" fill="#26333D" text-anchor="middle">外部主机 CPU</text><text x="600.0" y="790.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="middle">PCIe 5.0 x16</text><path d="M600,710 L600,742" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="828" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">功能分层示意，不是物理 floorplan；来源：MI350P brochure pp.1-2；CDNA 4 白皮书 p.9。</text></svg>