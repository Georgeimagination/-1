<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img"><title>MI300X-架构</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#687984"/></marker></defs><rect width="1200" height="830" fill="white"/><text x="32" y="38" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="700" fill="#26333D" text-anchor="start">AMD Instinct MI300X | CDNA 3</text><text x="32" y="67" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="400" fill="#5C6770" text-anchor="start">8 compute dies above 4 I/O dies; HBM belongs to the same GPU package</text><rect x="30" y="95" width="1140" height="565" rx="12" fill="white" stroke="#73808A" stroke-width="2"/><text x="46" y="122" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#73808A" text-anchor="start">单 GPU 封装：8 XCD + 4 IOD + 8 HBM stacks</text><rect x="65" y="145" width="790" height="225" rx="12" fill="white" stroke="#377991" stroke-width="2"/><text x="81" y="172" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#377991" text-anchor="start">8 × XCD 计算裸片 · TSMC 5nm</text><rect x="85" y="195" width="172" height="62" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="171.0" y="220.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">XCD 0</text><text x="171.0" y="244.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">38 active CU + 4MB L2</text><rect x="275" y="195" width="172" height="62" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="361.0" y="220.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">XCD 1</text><text x="361.0" y="244.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">38 active CU + 4MB L2</text><rect x="465" y="195" width="172" height="62" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="551.0" y="220.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">XCD 2</text><text x="551.0" y="244.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">38 active CU + 4MB L2</text><rect x="655" y="195" width="172" height="62" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="741.0" y="220.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">XCD 3</text><text x="741.0" y="244.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">38 active CU + 4MB L2</text><rect x="85" y="271" width="172" height="62" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="171.0" y="296.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">XCD 4</text><text x="171.0" y="320.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">38 active CU + 4MB L2</text><rect x="275" y="271" width="172" height="62" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="361.0" y="296.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">XCD 5</text><text x="361.0" y="320.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">38 active CU + 4MB L2</text><rect x="465" y="271" width="172" height="62" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="551.0" y="296.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">XCD 6</text><text x="551.0" y="320.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">38 active CU + 4MB L2</text><rect x="655" y="271" width="172" height="62" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="741.0" y="296.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">XCD 7</text><text x="741.0" y="320.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#26333D" text-anchor="middle">38 active CU + 4MB L2</text><rect x="885" y="158" width="250" height="190" rx="9" fill="#EEF7FA" stroke="#377991" stroke-width="2"/><text x="1010.0" y="223.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">每个 CU</text><text x="1010.0" y="247.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">Scalar / Vector / Matrix</text><text x="1010.0" y="271.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">32KB L1 data cache</text><text x="1010.0" y="295.0" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">64KB LDS · 软件管理</text><text x="75" y="397" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="start">XCD 垂直堆叠在 IOD 上；下图按功能分层展开</text><rect x="65" y="425" width="790" height="117" rx="12" fill="white" stroke="#637D37" stroke-width="2"/><text x="81" y="452" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#637D37" text-anchor="start">4 × IOD · TSMC 6nm</text><rect x="85" y="466" width="455" height="53" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="312.5" y="498.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#26333D" text-anchor="middle">Infinity Cache 256MB · 全 GPU 合计</text><rect x="560" y="466" width="275" height="53" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="697.5" y="498.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#26333D" text-anchor="middle">Infinity Fabric + HBM 接口</text><path d="M460,370 L460,425" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="885" y="425" width="250" height="117" rx="9" fill="#FCF1F6" stroke="#AA5578" stroke-width="2"/><text x="1010.0" y="465.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">8 × HBM3</text><text x="1010.0" y="489.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">每 stack 24GB</text><text x="1010.0" y="513.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">合计 192GB · 5.3TB/s</text><path d="M855,483 L885,483" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="75" y="583" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="start">每个 IOD 承接 2 个 XCD，并连接 2 个 HBM stack。</text><text x="75" y="613" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="400" fill="#26333D" text-anchor="start">L2 属于各 XCD；Infinity Cache 位于 IOD，二者不是同一组 SRAM。</text><rect x="120" y="701" width="350" height="65" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="295.0" y="727.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">外部主机 CPU</text><text x="295.0" y="751.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">PCIe 5.0 x16</text><rect x="650" y="701" width="450" height="65" rx="9" fill="#F2F6EA" stroke="#637D37" stroke-width="2"/><text x="875.0" y="727.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">同节点的其他 GPU</text><text x="875.0" y="751.5" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="400" fill="#26333D" text-anchor="middle">7 × Infinity Fabric · 128GB/s/条（双向）</text><path d="M285,660 L285,701" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M860,660 L860,701" stroke="#687984" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="785" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">功能与访问关系示意，不是物理 floorplan；线条不表示所有数据都必须经过全部 cache。</text><text x="32" y="808" font-family="Arial, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="400" fill="#5C6770" text-anchor="start">来源：CDNA 3 白皮书 Figure 2 / pp.5,9-11,15-17；MI300X datasheet（7 IF + 1 host）。</text></svg>